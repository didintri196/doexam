{{- $secret := include "doexam.secretName" . -}}
{{- $pgPassword := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $pgPassword = .Values.postgresql.password | default (include "doexam.persistedSecret" (dict "root" . "secret" $secret "key" "postgres-password" "generate" (randAlphaNum 32))) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "doexam.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.database.existingSecret }}
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ $pgPassword | quote }}
  database-url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" (.Values.postgresql.username | urlquery) ($pgPassword | urlquery) (include "doexam.component" (dict "root" . "component" "postgresql")) .Values.postgresql.database | quote }}
  {{- else }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.mediaSigningKey.existingSecret }}
  {{- /* 64 hex characters = 32 bytes, kept across upgrades: a new key breaks open media links */}}
  media-signing-key: {{ include "doexam.persistedSecret" (dict "root" . "secret" $secret "key" "media-signing-key" "generate" (sha256sum (randAlphaNum 64))) | quote }}
  {{- end }}
  {{- if and .Values.redis.url (not .Values.redis.enabled) (not .Values.redis.existingSecret) }}
  redis-url: {{ .Values.redis.url | quote }}
  {{- end }}
  {{- if .Values.metrics.enabled }}
  metrics-token: {{ .Values.metrics.token | default (include "doexam.persistedSecret" (dict "root" . "secret" $secret "key" "metrics-token" "generate" (randAlphaNum 40))) | quote }}
  {{- end }}
