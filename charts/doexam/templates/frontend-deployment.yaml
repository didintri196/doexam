{{- if eq .Values.mode "distributed" }}
{{- range $entry := list "exam" "panel" }}
{{- $cfg := index $.Values.frontend $entry -}}
{{- $sel := dict "root" $ "component" $entry }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doexam.component" $sel }}
  labels:
    {{- include "doexam.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $entry }}
spec:
  {{- if not $cfg.autoscaling.enabled }}
  replicas: {{ $cfg.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "doexam.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "doexam.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $sel.component }}
    spec:
      serviceAccountName: {{ include "doexam.serviceAccountName" $ }}
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # nginx-unprivileged runs as uid 101
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: {{ include "doexam.image" (dict "root" $ "image" (index $.Values.image $entry)) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # nginx forwards /api to the server (used when the ingress does not split paths)
            - name: API_UPSTREAM
              value: {{ printf "http://%s:%v" (include "doexam.serverName" $) $.Values.service.port | quote }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          volumeMounts:
            # the image renders its config template at start and keeps its pid/cache in /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      {{- with $.Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
