name: Release

# A tag vX.Y.Z (or vX.Y.Z-rc.N) of this repository publishes one product release built
# from the pinned server and client commits: Linux binaries, four images, the Helm chart.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: didintri196

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: v
        run: |
          tag=${GITHUB_REF_NAME}
          version=${tag#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"
          s=$(git -C apps/server rev-parse --short HEAD); c=$(git -C apps/client rev-parse --short HEAD)
          echo "build=$tag+server.$s.client.$c" >> "$GITHUB_OUTPUT"

  binaries:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: doexam, POSTGRES_PASSWORD: secret, POSTGRES_DB: doexam }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U doexam" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/client/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: apps/server/go.mod, cache-dependency-path: apps/server/go.sum }
      - run: make build GOARCH=${{ matrix.arch }} TAG=${{ github.ref_name }} VERSION=${{ needs.meta.outputs.build }}
      - name: smoke test (amd64)
        if: matrix.arch == 'amd64'
        env: { DATABASE_URL: "postgres://doexam:secret@localhost:5432/doexam?sslmode=disable" }
        run: make smoke GOARCH=amd64
      - name: package
        run: |
          d=doexam_linux_${{ matrix.arch }}
          mkdir -p dist/$d
          cp out/doexam-linux-${{ matrix.arch }} dist/$d/doexam
          cp LICENSE README.md README.en.md dist/$d/
          tar -C dist -czf dist/$d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: dist/*.tar.gz

  images:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: doexam, context: ., file: deploy/Dockerfile.aio }
          - { name: doexam-server, context: apps/server, file: apps/server/Dockerfile }
          - { name: doexam-exam, context: apps/client, file: apps/client/Dockerfile.exam }
          - { name: doexam-panel, context: apps/client, file: apps/client/Dockerfile.panel }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.meta.outputs.build }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.meta.outputs.build }}
            TAG=${{ github.ref_name }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    needs: [meta, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: package and push the chart (OCI)
        run: |
          v=${{ needs.meta.outputs.version }}
          helm package charts/doexam --version "$v" --app-version "$v" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          helm push dist/doexam-$v.tgz oci://${{ env.REGISTRY }}/${{ env.OWNER }}/charts
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/*.tgz

  release:
    needs: [meta, binaries, images, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums and notes
        run: |
          cd dist && sha256sum * > checksums.txt && cat checksums.txt && cd ..
          v=${{ needs.meta.outputs.version }}
          s=$(git -C apps/server rev-parse HEAD); c=$(git -C apps/client rev-parse HEAD)
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## DoExam $GITHUB_REF_NAME"
            echo
            echo "| Komponen | Commit |"
            echo "|---|---|"
            echo "| server | [\`${s:0:7}\`](https://github.com/${{ env.OWNER }}/doexam-server/commit/$s) |"
            echo "| client | [\`${c:0:7}\`](https://github.com/${{ env.OWNER }}/doexam-client/commit/$c) |"
            echo
            echo "### Pasang"
            echo
            echo '```bash'
            echo "# binary Linux (amd64 / arm64)"
            echo "curl -LO https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/doexam_linux_amd64.tar.gz"
            echo "# Docker"
            echo "docker pull ghcr.io/${{ env.OWNER }}/doexam:$v"
            echo "# Helm"
            echo "helm install doexam oci://ghcr.io/${{ env.OWNER }}/charts/doexam --version $v"
            echo '```'
            echo
            echo "Image: \`doexam\` (aio), \`doexam-server\`, \`doexam-exam\`, \`doexam-panel\` di ghcr.io/${{ env.OWNER }}, tag \`$v\`."
            if [[ -n "$prev" ]]; then
              echo
              echo "### Perubahan sejak $prev"
              echo
              echo "- repo ini: https://github.com/${{ github.repository }}/compare/$prev...$GITHUB_REF_NAME"
              ps=$(git rev-parse "$prev:apps/server"); pc=$(git rev-parse "$prev:apps/client")
              echo "- server: https://github.com/${{ env.OWNER }}/doexam-server/compare/$ps...$s"
              echo "- client: https://github.com/${{ env.OWNER }}/doexam-client/compare/$pc...$c"
            fi
          } > notes.md
          cat notes.md
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          [[ "${{ needs.meta.outputs.prerelease }}" == "true" ]] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tgz dist/checksums.txt \
            --title "DoExam $GITHUB_REF_NAME" --notes-file notes.md $flags
